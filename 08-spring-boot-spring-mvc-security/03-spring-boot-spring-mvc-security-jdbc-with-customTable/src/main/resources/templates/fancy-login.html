<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div id="loginbox" style="margin-top: 50px;" class="col-lg-4 col-md-6 col-sm-8 mx-auto">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white text-center">
                <h4 class="mb-0">Sign In</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/authenticateTheUser}" method="POST" class="form-horizontal">
                    <!-- Login Error Message -->
                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        <strong>Error:</strong> Invalid username or password.
                    </div>

                    <!-- Logout Message -->
                    <div th:if="${param.logout}" class="alert alert-success text-center">
                        You have successfully logged out.
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username"
                               class="form-control" required aria-label="Username"/>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                               class="form-control" required aria-label="Password"/>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+HAMCPklj7Sk3v9jMXqD/YvoRSJgQ"
        crossorigin="anonymous"></script>
</body>
</html>
