<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center text-primary">Hello, World!</h2>
    <hr/>
    <h3 class="text-center text-secondary">Welcome to Roushan's Home Page</h3>
    <hr/>

    <!-- Display username and role -->
    <div class="mb-4">
        <p>
            <strong>User:</strong> <span sec:authentication="principal.username"></span>
        </p>
        <p>
            <strong>Role(s):</strong> <span sec:authentication="principal.authorities"></span>
        </p>
    </div>

    <!-- Managers Section -->
    <div sec:authorize="hasRole('MANAGER')" class="mb-4">
        <p>
            <a class="btn btn-info" th:href="@{/leaders}">Leadership Meeting</a>
            <span class="text-muted">(Only for Manager Peeps)</span>
        </p>
    </div>

    <!-- Admins Section -->
    <div sec:authorize="hasRole('ADMIN')" class="mb-4">
        <p>
            <a class="btn btn-warning" th:href="@{/systems}">IT Systems Meeting</a>
            <span class="text-muted">(Only for Admin Peeps)</span>
        </p>
    </div>

    <hr/>

    <!-- Logout Button -->
    <div class="text-center mt-4">
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>
</div>

<!-- Bootstrap JS and Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+HAMCPklj7Sk3v9jMXqD/YvoRSJgQ"
        crossorigin="anonymous"></script>
</body>
</html>
