spring.application.name=crudDemo
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent
#Comments both then check terminal then uncomment check
#Turn off the Spring banner from terminal(i.e.),
#  .   ____          _            __ _ _
# /\\ / ___'_ __ _ _(_)_ __  __ _ \ \ \ \
#( ( )\___ | '_ | '_| | '_ \/ _` | \ \ \ \
# \\/  ___)| |_)| | | | | || (_| |  ) ) ) )
#  '  |____| .__|_| |_|_| |_\__, | / / / /
# =========|_|==============|___/=/_/_/_/
#
# :: Spring Boot ::                (v3.3.4)
spring.main.banner-mode=off
#Reduce logging level. You only want to see important thing in the terminal
#Set logging level to warn
logging.level.root=WARN
#it will still show error and warning

#Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Configure JPA/Hibernate to auto create the tables
#spring.jpa.hibernate.ddl-auto=create

# the update config will keep existing data in the table
spring.jpa.hibernate.ddl-auto=update