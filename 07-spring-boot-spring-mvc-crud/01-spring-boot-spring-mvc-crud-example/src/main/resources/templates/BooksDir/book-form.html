<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${book?.id != null ? 'Update Book' : 'Add Book'}">Book Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3 th:text="${book?.id != null ? 'Update Book' : 'Add New Book'}">Book Form</h3>
    <hr/>

    <form th:action="@{/books/save}" th:object="${book}" method="POST">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="title" class="form-label">Book Title</label>
            <input type="text" th:field="*{title}" id="title" class="form-control" placeholder="Enter book title"
                   required/>
        </div>

        <div class="mb-3">
            <label for="authorFirstName" class="form-label">Author First Name</label>
            <input type="text" th:field="*{authorFirstName}" id="authorFirstName" class="form-control"
                   placeholder="Enter author's first name" required/>
        </div>

        <div class="mb-3">
            <label for="authorLastName" class="form-label">Author Last Name</label>
            <input type="text" th:field="*{authorLastName}" id="authorLastName" class="form-control"
                   placeholder="Enter author's last name" required/>
        </div>

        <div class="mb-3">
            <label for="releasedYear" class="form-label">Released Year</label>
            <input type="number" th:field="*{releasedYear}" id="releasedYear" class="form-control"
                   placeholder="Enter year of release" required/>
        </div>

        <div class="mb-3">
            <label for="stockQuantity" class="form-label">Stock Quantity</label>
            <input type="number" th:field="*{stockQuantity}" id="stockQuantity" class="form-control"
                   placeholder="Enter stock quantity" required/>
        </div>

        <div class="mb-3">
            <label for="pages" class="form-label">Pages</label>
            <input type="number" th:field="*{pages}" id="pages" class="form-control" placeholder="Enter number of pages"
                   required/>
        </div>

        <button type="submit" class="btn btn-info">Save</button>
        <a th:href="@{/books/list}" class="btn btn-secondary">Back to Book List</a>
    </form>
</div>
</body>
</html>
