<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Book Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1>Book Directory</h1>
    <hr/>

    <a th:href="@{/books/showFormForAdd}" class="btn btn-primary mb-3">Add New Book</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Author First Name</th>
            <th>Author Last Name</th>
            <th>Released Year</th>
            <th>Stock Quantity</th>
            <th>Pages</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.authorFirstName}"></td>
            <td th:text="${book.authorLastName}"></td>
            <td th:text="${book.releasedYear}"></td>
            <td th:text="${book.stockQuantity}"></td>
            <td th:text="${book.pages}"></td>
            <td>
                <a th:href="@{/books/showFormForUpdate(bookId=${book.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/books/delete(bookId=${book.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this book?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
